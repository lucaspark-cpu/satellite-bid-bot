name: Daily Satellite Bid Briefing

on:
  schedule:
    # KST 08:30 월~금 = UTC 23:30 일~목 (KST-9h → 전날로 밀림)
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 중복 발송 방지를 위한 상태 파일(sqlite)을 런 간 유지
      - name: Restore bid DB cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: g2b_bids.db
          key: g2b-bids-db-${{ github.run_id }}
          restore-keys: |
            g2b-bids-db-

      - name: Run scoring self-test
        run: python test_scoring.py

      - name: Run Bid Bot & Send Email
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          D2B_API_KEY: ${{ secrets.D2B_API_KEY }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          BID_DB_PATH: g2b_bids.db
        run: python g2b_bot_email.py

      - name: Save bid DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: g2b_bids.db
          key: g2b-bids-db-${{ github.run_id }}
