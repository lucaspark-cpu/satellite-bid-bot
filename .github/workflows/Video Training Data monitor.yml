name: D2B 영상 학습데이터 자동화 키워드 모니터

on:
  schedule:
    # KST 매일 10:07 = UTC 01:07 (기존 스케줄(08:07/09:07/13:07/17:07)과 안 겹치게 배치)
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-training-data-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Training Data Monitor & Send Email
        env:
          D2B_API_KEY: ${{ secrets.D2B_API_KEY }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python video_training_data_monitor.py

      - name: 상태 파일(seen_video_training_data.json) 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain seen_video_training_data.json)" ]; then
            git add seen_video_training_data.json
            git commit -m "chore: 영상 학습데이터 키워드 신규 알림 발송 이력 갱신"
            git push
          fi
